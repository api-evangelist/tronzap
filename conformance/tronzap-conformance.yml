domain_standards:
  note: >-
    Cryptocurrency infrastructure has no API-layer domain standard equivalent to SCIM, FHIR or
    OpenRTB. What TronZap's contract does declare is the on-chain standards it operates
    against, and those are visible in the contract itself rather than only in marketing copy.
    REWARD-ONLY: nothing is asserted here that the docs do not state.
  declared:
  - id: trc-20
    name: TRC-20 token standard (TRON)
    conforms: true
    evidence: >-
      The entire product is priced and specified against TRC-20 USDT transfer mechanics. The
      reference states the exact resource cost of a TRC-20 transfer — 65,000 energy + 345
      bandwidth for a standard transfer, 131,000 energy to a new or inactive wallet — and
      POST /v1/estimate-energy takes the contract address of the TRC-20 token being
      transferred (error sub-key invalid_tron_address.contract_address).
    source: https://docs.tronzap.com/api/estimate-energy.html
  - id: tron-resource-model
    name: TRON Energy / Bandwidth resource and delegation model
    conforms: true
    evidence: >-
      The contract's core nouns are TRON protocol primitives, not TronZap inventions — energy,
      bandwidth, delegation duration (fixed at 1 hour), address activation, and the
      OUT_OF_ENERGY failure mode. resources.energy / resources.bandwidth and
      params.duration=1 map directly onto TRON's staking-and-delegation model.
    source: https://docs-wallets.tronzap.com/api/create-order.html
  - id: base58-tron-address
    name: TRON Base58Check address format
    conforms: true
    evidence: >-
      Address validation is specified in the contract — "must start with T, 34 chars" — and
      enforced as error code 10 / invalid_tron_address with per-field sub-keys.
    source: https://docs-wallets.tronzap.com/api/error-codes.html
  - id: ulid
    name: ULID identifiers
    conforms: true
    evidence: >-
      Orders API order_id is documented as a ULID, with a real example
      (01HZX5N6Q9TY3K2P0VWB7HRD4M).
    source: https://docs-wallets.tronzap.com/api/create-order.html
