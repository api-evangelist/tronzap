apis:
- name: TronZap REST API
  description: 'REST API for TRON Energy and Bandwidth rental, energy subscriptions, and AML crypto checks. Endpoints include
    Get Services, Check Balance, Estimate Energy, Address Info, Calculate Resource Cost, Create/Check Transaction, subscription
    lifecycle, and AML checks. Bearer token + SHA256 X-Signature authentication.


    No OpenAPI is published. Re-probed 2026-08-30 against every host: /openapi.json, /openapi.yaml, /swagger.json,
    /v1/openapi.json, /api-docs, /docs and /redoc all 404 on api.tronzap.com (clean JSON 404s), and on tronzap.com,
    docs.tronzap.com and docs-wallets.tronzap.com (HTML 404 shells). The declared apis.json at docs.tronzap.com/apis.json
    also 404s. TronZap does publish one real machine-readable contract: a first-party public Postman Collection v2.0.0,
    "Tron Energy API by TronZap.com", 9 requests, harvested verbatim to postman/tronzap.postman_collection.json. It covers
    8 of the 17 documented account endpoints and carries POST /v1/energy/calculate where the reference documents
    POST /v1/calculate. Also published: a 9KB llms.txt, a server-rendered HTML reference at docs.tronzap.com/api/, and four
    official MIT SDKs (PHP, Node.js, Python, Go). Nothing was invented.'
