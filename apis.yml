- name: TronZap Wallet Orders API
  description: >-
    Fully public, unauthenticated Orders API for non-custodial wallet integrations. Four operations —
    POST /v1/orders/calculate (a true dry run whose total is guaranteed to equal the order amount),
    POST /v1/orders (returns a deposit address, an exact TRX amount and a ttl, typically 3600s),
    POST /v1/orders/check and POST /v1/orders/cancel. The provider states "No authentication headers are
    required. The Orders API is fully public"; only Content-Type and Accept are needed, and an optional
    referral_code carries partner commission. It is the only TronZap surface with a documented rate limit
    (1 request/second/IP, HTTP 429, no Retry-After — observed live 2026-08-30) and the only one with a
    documented reversal path (cancel while the order is still in `new` status). Orders move through
    new, paid, processing, completed, failed, cancelled, expired. Documented at docs-wallets.tronzap.com;
    no SDK covers it and llms.txt does not mention it. No OpenAPI. Verified 2026-08-30.
  humanURL: https://docs-wallets.tronzap.com/api/
  baseURL: https://api.tronzap.com/v1/
