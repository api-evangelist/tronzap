note: >-
  TronZap sells a metered blockchain resource, not API call quota. There is no free tier, no
  request allowance and no per-seat pricing — the meter is TRX spent on energy and bandwidth,
  and API access itself is free with an account. Two commercial tiers are published on the
  B2B page; unit prices are published on the marketing site and are also readable at runtime
  from the public calculate endpoint, which is unusual and useful: the price list is
  machine-readable without credentials.
