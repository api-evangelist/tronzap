- name: tronzap_calculate_order_price
  status: candidate
  surface: TronZap Wallet Orders API
  rest: POST /v1/orders/calculate
  auth: none
  side_effects: none
  description: >-
    Price energy and/or bandwidth for a 1-hour rental without creating an order. The returned
    total equals the TRX amount a subsequent order will require.
  inputs: [duration, activation, resources.energy, resources.bandwidth]
  source: https://docs-wallets.tronzap.com/api/calculate.html
