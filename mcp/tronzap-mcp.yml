opportunity:
  note: >-
    The Wallet Orders API is unusually well suited to MCP: it is fully unauthenticated, has a
    four-operation surface, publishes a true dry-run (POST /v1/orders/calculate whose total is
    guaranteed to equal the order amount) and a real cancel path. An MCP server over it would
    need no credential plumbing at all — the only guardrails required are the 1 req/s per-IP
    ceiling and the fact that a completed order spends real TRX.
